[package]
name = "gathermesh_ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
# Keep rlib for native ABI/envelope integration tests; cdylib remains the runtime artifact.
crate-type = ["cdylib", "rlib"]

[profile.release]
panic = "unwind"

[dependencies]
anyhow = "1"
base64 = "=0.22.1"
blake3 = "1.8"
bytes = "1.7"
futures-util = { version = "0.3", features = ["std"] }
hex = "0.4"
iroh = { version = "=1.0.3", default-features = true }
iroh-blobs = { version = "=0.103.0", default-features = true }
iroh-docs = { version = "=0.101.0", default-features = true }
iroh-gossip = { version = "=0.101.0", features = ["net"], default-features = false }
n0-future = { version = "0.3.1", features = ["serde"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uhlc = "=0.9.0"
