name: Publish

on:
  push:
    tags:
      - '*.*.*.*'

jobs:
  build-plugin:
    name: Build .NET plugin
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply pinned dependency patches
        run: git apply patches/ElliCon-null-safe-hook-status.patch patches/ElliLib-nullable-path-dropped-event.patch

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet packages
        run: dotnet restore GatherBuddy/GatherBuddy.csproj

      - name: Build plugin
        run: dotnet build --no-restore -c Release GatherBuddy/GatherBuddy.csproj -p:AssemblyVersion=${{ github.ref_name }} -p:FileVersion=${{ github.ref_name }} -p:PackageVersion=${{ github.ref_name }} -p:InformationalVersion=${{ github.ref_name }} --output .\build

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: build
          if-no-files-found: error

  build-native:
    name: Build Donatello FFI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native solver
        run: cargo build --locked --release --package donatello-ffi --manifest-path donatello/Cargo.toml

      - name: Upload native solver
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: donatello/target/release/donatello_ffi.dll
          if-no-files-found: error

  package:
    name: Package plugin
    needs: [build-plugin, build-native]
    runs-on: windows-latest
    steps:
      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: build

      - name: Download native solver
        uses: actions/download-artifact@v4
        with:
          name: native-build
          path: build

      - name: Create release archive
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Compress-Archive -Path .\build\* -DestinationPath .\package\GatherBuddyAscended.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: package/GatherBuddyAscended.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          files: release/GatherBuddyAscended.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy plugin repository
    needs: package
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: _site

      - name: Build Dalamud repository feed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          download_url="https://slobodaapl.github.io/GatherBuddyAscended/GatherBuddyAscended.zip"
          jq \
            --arg version "$RELEASE_TAG" \
            --arg download "$download_url" \
            '. + {
              AssemblyVersion: $version,
              TestingAssemblyVersion: $version,
              DownloadLinkInstall: $download,
              DownloadLinkUpdate: $download,
              DownloadLinkTesting: $download
            } | [.]' \
            manifest.json > _site/pluginmaster.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
