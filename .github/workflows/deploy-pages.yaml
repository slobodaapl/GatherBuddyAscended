name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy; leave blank to use the latest release
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  DeployPages:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download existing release plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p _site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern GatherBuddyAscended.zip \
            --dir _site

      - name: Build Dalamud repository feed
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          download_url="https://slobodaapl.github.io/GatherBuddyAscended/GatherBuddyAscended.zip"
          jq \
            --arg version "$RELEASE_TAG" \
            --arg download "$download_url" \
            '. + {
              AssemblyVersion: $version,
              TestingAssemblyVersion: $version,
              DownloadLinkInstall: $download,
              DownloadLinkUpdate: $download,
              DownloadLinkTesting: $download
            } | [.]' \
            manifest.json > _site/pluginmaster.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
