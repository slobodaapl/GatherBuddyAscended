<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Donatello improvement rate by recipe level</title>
  <desc id="desc">Regular-recipe measurements rise from 15.9 percent at level 10 to 54.7 percent at level 100. Their linear trend has an R squared of 0.86. Expert observations are 61.1 percent at level 80 and 52.4 percent at level 100.</desc>

  <rect width="1200" height="675" fill="#111827"/>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="88" y="63" fill="#f8fafc" font-size="30" font-weight="600">Donatello improvement rate by recipe level</text>
    <text x="88" y="96" fill="#94a3b8" font-size="17">Share of simulated replan opportunities where Donatello found a strictly better continuation</text>

    <g stroke="#2b3a50" stroke-width="1">
      <path d="M120 560H1110"/><path d="M120 501H1110"/><path d="M120 443H1110"/>
      <path d="M120 384H1110"/><path d="M120 326H1110"/><path d="M120 267H1110"/>
      <path d="M120 209H1110"/><path d="M120 150H1110"/>
    </g>

    <g fill="#8290a6" font-size="15" text-anchor="end">
      <text x="103" y="566">0%</text><text x="103" y="507">10%</text>
      <text x="103" y="449">20%</text><text x="103" y="390">30%</text>
      <text x="103" y="332">40%</text><text x="103" y="273">50%</text>
      <text x="103" y="215">60%</text><text x="103" y="156">70%</text>
    </g>

    <path d="M120 472L1110 254" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="M120 467L230 428L340 442L450 363L560 434L670 327L780 360L890 308L1000 262L1110 240" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#111827" stroke="#5eead4" stroke-width="3">
      <circle cx="120" cy="467" r="6"/><circle cx="230" cy="428" r="6"/>
      <circle cx="340" cy="442" r="6"/><circle cx="450" cy="363" r="6"/>
      <circle cx="560" cy="434" r="6"/><circle cx="670" cy="327" r="6"/>
      <circle cx="780" cy="360" r="6"/><circle cx="890" cy="308" r="6"/>
      <circle cx="1000" cy="262" r="6"/><circle cx="1110" cy="240" r="7"/>
    </g>

    <g fill="#c084fc" stroke="#111827" stroke-width="3">
      <path d="M890 192l10 10-10 10-10-10z"/>
      <path d="M1110 243l10 10-10 10-10-10z"/>
    </g>

    <g fill="#8290a6" font-size="15" text-anchor="middle">
      <text x="120" y="590">10</text><text x="230" y="590">20</text>
      <text x="340" y="590">30</text><text x="450" y="590">40</text>
      <text x="560" y="590">50</text><text x="670" y="590">60</text>
      <text x="780" y="590">70</text><text x="890" y="590">80</text>
      <text x="1000" y="590">90</text><text x="1110" y="590">100</text>
      <text x="615" y="622" fill="#aeb9c9" font-size="17">Crafter / recipe level</text>
    </g>

    <g fill="#f8fafc">
      <text x="134" y="455" font-size="17" font-weight="600">15.9%</text>
      <text x="1097" y="222" font-size="20" font-weight="600" text-anchor="end">54.7%</text>
    </g>

    <g font-size="15">
      <path d="M532 118H572" stroke="#2dd4bf" stroke-width="2.5"/>
      <circle cx="552" cy="118" r="5" fill="#111827" stroke="#5eead4" stroke-width="2.5"/>
      <text x="583" y="124" fill="#cbd5e1">Measured regular recipes</text>
      <path d="M890 118H930" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="941" y="124" fill="#cbd5e1">Linear fit · R² = 0.86</text>
      <text x="907" y="207" fill="#cbd5e1">Expert: 61.1%</text>
      <text x="1127" y="258" fill="#cbd5e1">52.4%</text>
    </g>

    <text x="1110" y="650" fill="#66758c" font-size="14" text-anchor="end">13,806 simulated replan opportunities · real recipes · level-appropriate crafter stats</text>
  </g>
</svg>
